name: Bug report
description: Something on the site or in the code doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report it. A wrong test or a typo in a lesson has its own form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://cyberstars.app/lesson/python/print
        2. Click Run Tests
        3. ...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happens, if it's on the site.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Ubuntu 24.04
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps, such as a screenshot or the browser console's errors.
