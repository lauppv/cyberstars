name: 'Setup Node.js and Dependencies'
description: 'Sets up Node.js and installs/caches npm dependencies'
outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.cache-deps.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'npm'

    - name: Cache node_modules
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: node_modules
        # Key on BOTH manifests: a package.json change that drifts from the
        # lockfile must miss the cache so `npm ci` runs and fails on the
        # mismatch — keying on package-lock.json alone lets drift slip through a
        # cache hit and only surface on `npm ci` at deploy time.
        key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-

    - name: Install Dependencies
      shell: bash
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: npm ci

    # Regenerate the Prisma client even on cache hit: `npm ci` (with its
    # `postinstall`) is skipped when node_modules is restored, so a schema
    # change lands with a stale generated client if we don't do this.
    - name: Regenerate Prisma client
      shell: bash
      if: steps.cache-deps.outputs.cache-hit == 'true'
      run: npx prisma generate
