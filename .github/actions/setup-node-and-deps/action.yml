name: 'Setup Node.js and Dependencies'
description: 'Sets up Node.js and installs/caches npm dependencies'
outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.cache-deps.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'npm'

    - name: Cache node_modules
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ hashFiles('.node-version') }}-

    - name: Install Dependencies
      shell: bash
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: npm ci
