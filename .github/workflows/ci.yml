name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Dependencies
        id: setup
        uses: ./.github/actions/setup-node-and-deps

      - name: Cache node_modules for other jobs
        uses: actions/cache/save@v4
        if: steps.setup.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  format-check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage comment
        if: github.event_name == 'pull_request' && always()
        run: node .github/scripts/coverage-comment.js > coverage-comment.txt

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && always()
        with:
          recreate: true
          path: coverage-comment.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      # Audits what actually ships. Dev-only findings (linters, bundlers, test
      # runners) never reach a user and would otherwise block unrelated merges.
      - run: npm audit --audit-level=high --omit=dev

  dead-code:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run dead-code

  validate-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run validate:tests

  test-integration:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run test:integration

  test-e2e-browser:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-browser
          path: playwright-report/
          retention-days: 7

  test-e2e-docker:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: docker pull python:3.10-slim && docker pull gcc:latest && docker pull eclipse-temurin:21-jdk-alpine && docker pull danysk/kotlin:latest
      - run: docker build -t cyberstars-linux-sandbox server/runtimes/linux-sandbox
      - run: npm run test:e2e:docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-docker
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 3
