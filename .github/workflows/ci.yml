name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Dependencies
        id: setup
        uses: ./.github/actions/setup-node-and-deps

      - name: Cache node_modules for other jobs
        uses: actions/cache/save@v4
        if: steps.setup.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage comment
        if: github.event_name == 'pull_request' && always()
        run: node .github/scripts/coverage-comment.js > coverage-comment.txt

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && always()
        with:
          recreate: true
          path: coverage-comment.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 3
