name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Dependencies
        id: setup
        uses: ./.github/actions/setup-node-and-deps

      - name: Cache node_modules for other jobs
        uses: actions/cache/save@v4
        if: steps.setup.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  format-check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  test:
    # The web judge's runner tests need Playwright's Chromium, which 1.60 has
    # on Ubuntu 24.04 and not on 26.04 (ubuntu-latest), like the e2e jobs
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      # The web judge's runner tests drive a real headless Chromium
      - run: npx playwright install --only-shell chromium
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage comment
        if: github.event_name == 'pull_request' && always()
        run: node .github/scripts/coverage-comment.js > coverage-comment.txt

      # A fork's PR gets a read-only token and cannot comment, so there the
      # coverage goes to the job summary instead.
      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          path: coverage-comment.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Coverage in job summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: cat coverage-comment.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      # Audits what actually ships. Dev-only findings (linters, bundlers, test
      # runners) never reach a user and would otherwise block unrelated merges.
      - run: npm audit --audit-level=high --omit=dev

  dead-code:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run dead-code

  validate-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run validate:tests

  # Runs every Laniakea question template in the lessons' Python image and fails
  # when one doesn't make its questions or a made file is out of date.
  check-quiz:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: docker pull python:3.10-slim
      - run: npm run check:quiz

  test-integration:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test:integration

  test-e2e-browser:
    # Playwright 1.60 has no Chromium for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chromium's libraries; --with-deps only added
      # fonts and xvfb through apt, which took up to 11 min on a slow mirror
      - run: npx playwright install chromium
      - run: npm run test:e2e:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-browser
          path: playwright-report/
          retention-days: 7

  test-e2e-docker:
    # Playwright 1.60 has no Chromium for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberstars
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cyberstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberstars -d cyberstars_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cyberstars:testpassword@localhost:5432/cyberstars_test
      DB_USER: cyberstars
      DB_HOST: localhost
      DB_NAME: cyberstars_test
      DB_PASSWORD: testpassword
      DB_PORT: 5432
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chromium's libraries; --with-deps only added
      # fonts and xvfb through apt, which took up to 11 min on a slow mirror
      - run: npx playwright install chromium
      - run: docker pull python:3.10-slim && docker pull gcc:16.1.0 && docker pull eclipse-temurin:21-jdk-alpine
      - run: docker build -t cyberstars-linux-sandbox apps/api/src/runtimes/linux-sandbox
      - run: docker build -t cyberstars-web-sandbox apps/api/src/runtimes/web-sandbox
      - run: npm run test:e2e:docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-docker
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      # The whole history: the sitemap's lastmod is the day git last committed
      # each page's file (apps/ui/scripts/prerender.tsx), and a shallow clone
      # has one commit holding every file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-and-deps
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - run: npm run build

      # The deploy ships this artifact, so it keeps dot files too (a future
      # .well-known/, say), which upload-artifact leaves out by default.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/ui/dist/
          include-hidden-files: true
          retention-days: 3

  # The server's deploy (deploy/deploy.sh) downloads the build for the commit it
  # deploys from here, so it never builds on its one CPU. Only main, and only
  # once every job above passed: a red commit never gets a build to deploy.
  # Everything goes on one pre-release, `ui-build`, so there's no tag per
  # commit. The repo is public and so is the build: it holds only what any
  # visitor's browser gets, and the server downloads it without a token.
  publish-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      [
        format-check,
        lint,
        typecheck,
        test,
        audit,
        dead-code,
        validate-tests,
        check-quiz,
        test-integration,
        test-e2e-browser,
        test-e2e-docker,
        build,
      ]
    # Write access to releases in this job only; every other job keeps the
    # read-only token set at the top.
    permissions:
      contents: write
    # No concurrency group: GitHub keeps only one waiting run per group and
    # cancels it when a third arrives, so a quick run of merges would leave a
    # commit with no build. Runs publish side by side instead, and the steps
    # below put up with another run doing the same thing at once.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARCHIVE: ui-dist-${{ github.sha }}.tar.gz
      KEEP: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      # The build reads no secret (no .env in CI), but check what ships anyway:
      # the page itself, and no env file or source map.
      - name: Check the build holds only the site
        run: |
          test -f dist/index.html
          leaked=$(find dist \( -name '.env*' -o -name '*.map' \) -print)
          if [ -n "$leaked" ]; then
            echo "::error::These files must not ship: $leaked"
            exit 1
          fi

      - name: Pack the build
        run: |
          tar -czf "$ARCHIVE" -C dist .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      # The checksum goes up last: the deploy waits for it, so once it's there
      # the archive is too.
      - name: Publish on the ui-build pre-release
        run: |
          # Another run may create the release first: then it's there to view.
          gh release view ui-build > /dev/null 2>&1 ||
            gh release create ui-build --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "UI build" \
              --notes "The site's build for each recent commit on main, downloaded by deploy/deploy.sh. Made by CI, never by hand." ||
            gh release view ui-build > /dev/null
          gh release upload ui-build "$ARCHIVE" --clobber
          gh release upload ui-build "$ARCHIVE.sha256" --clobber

      # Two runs at once can pick the same old build; whichever deletes it
      # second finds it gone, which is fine. The newest builds, this run's and
      # any other's, always sort first and stay.
      - name: Keep only the last builds
        run: |
          gh release view ui-build --json assets \
            --jq ".assets | map(select(.name | endswith(\".tar.gz\"))) | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].name" |
            while read -r old; do
              gh release delete-asset ui-build "$old" --yes || true
              gh release delete-asset ui-build "$old.sha256" --yes || true
            done
