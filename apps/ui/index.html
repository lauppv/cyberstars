<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Learn to code for free, no card needed | CyberStars</title>
    <meta
      name="description"
      content="Totally free: no card, no paid plan, nothing to install. Learn Python, Java, C and Linux by doing: write code in your browser and test it right away."
    />
    <link rel="canonical" href="https://cyberstars.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberStars" />
    <meta property="og:url" content="https://cyberstars.app/" />
    <meta property="og:title" content="Learn to code for free, no card needed | CyberStars" />
    <meta
      property="og:description"
      content="Totally free: no card, no paid plan, nothing to install. Learn Python, Java, C and Linux by doing: write code in your browser and test it right away."
    />
    <meta property="og:image" content="https://cyberstars.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CyberStars: learn to code for free. Python, Java, C and Linux, right in your browser. No card, nothing to install."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Before the first paint: send old # links and visitors who picked
         Romanian to the right address, and hide the pre-rendered HTML from
         every browser but a visitor's on the landing page. -->
    <script src="/boot.js"></script>
    <style>
      [data-hide-prerender] [data-prerender] {
        display: none;
      }
    </style>
    <!-- Data, not a script that runs, so the CSP leaves it alone. The FAQ joins
         this graph only once its copy is final. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://cyberstars.app/#organization",
            "name": "CyberStars",
            "url": "https://cyberstars.app/",
            "logo": "https://cyberstars.app/favicon.svg",
            "sameAs": ["https://github.com/lauppv/cyberstars"]
          },
          {
            "@type": "WebSite",
            "@id": "https://cyberstars.app/#website",
            "name": "CyberStars",
            "url": "https://cyberstars.app/",
            "inLanguage": ["en", "ro"],
            "publisher": {
              "@id": "https://cyberstars.app/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
