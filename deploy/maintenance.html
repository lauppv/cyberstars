<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>CyberStars · se actualizează</title>
    <style>
      :root {
        --bg: #0b0b12;
        --accent: #6c5ce7;
        --text: #e7e7ef;
        --muted: #9a9ab0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(1200px 600px at 70% -10%, rgba(108, 92, 231, 0.18), transparent 60%),
          radial-gradient(900px 500px at 10% 110%, rgba(108, 92, 231, 0.12), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family:
          "Space Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
      }
      .orbit {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border: 2px solid rgba(108, 92, 231, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
        letter-spacing: 0.2px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .hint {
        margin-top: 18px;
        font-size: 0.85rem;
        color: rgba(154, 154, 176, 0.7);
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="orbit"></div>
      <h1>Aplicăm un update ✨</h1>
      <p>
        CyberStars se actualizează chiar acum. Durează doar câteva secunde — pagina se reîncarcă
        singură când totul e gata.
      </p>
      <p class="hint">Nu trebuie să faci nimic. Rămâi pe recepție.</p>
    </div>
  </body>
</html>
