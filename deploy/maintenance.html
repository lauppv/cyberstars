<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>CyberStars · updating</title>
    <style>
      :root {
        --accent: #6c5ce7;
        --text: #e7e7ef;
        --muted: #9a9ab0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 50%, #1a0d3d 0%, #0a0518 55%, #000 100%);
        color: var(--text);
        font-family:
          'Space Grotesk',
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
        overflow: hidden;
      }
      .card {
        position: relative;
        z-index: 2;
        max-width: 460px;
      }
      .orbit {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border: 2px solid rgba(108, 92, 231, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
        letter-spacing: 0.2px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .ro {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid rgba(108, 92, 231, 0.2);
      }
      .ro h1 {
        font-size: 1.15rem;
        color: rgba(231, 231, 239, 0.85);
      }
      .ro p {
        color: rgba(154, 154, 176, 0.8);
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="orbit"></div>
      <h1>We're applying an update</h1>
      <p>
        CyberStars is updating right now. It only takes a few seconds. This page reloads itself when
        everything is ready.
      </p>
      <div class="ro">
        <h1>Aplicăm un update</h1>
        <p>
          CyberStars se actualizează chiar acum. Durează doar câteva secunde. Pagina se reîncarcă
          singură când totul e gata.
        </p>
      </div>
    </div>
  </body>
</html>
