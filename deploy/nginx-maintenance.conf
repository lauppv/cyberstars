# Maintenance-page wiring for the CyberStars nginx server block.
#
# Merge these snippets into the existing `server { ... }` for cyber-stars.org.
# The deploy script (deploy/deploy.sh) creates /opt/cyberstars/maintenance.on
# before building and removes it after the new backend is healthy. While that
# file exists, nginx serves the static themed page for EVERY request with a
# 503 status (correct for SEO / retry), never touching the Node backend.
#
# After editing the real config:  nginx -t && systemctl reload nginx

# --- 1. Put this near the TOP of the server block, before your location blocks:

    set $maintenance 0;
    if (-f /opt/cyberstars/maintenance.on) {
        set $maintenance 1;
    }

# --- 2. Inside your main proxy location (the one that proxy_passes to :8080),
#        add the guard as the FIRST line. Repeat the same two lines inside the
#        /ws/ location so websockets also 503 during a deploy.

    location / {
        if ($maintenance) { return 503; }

        proxy_pass http://localhost:8080;
        # ... keep your existing proxy_set_header lines ...
    }

    location /ws/ {
        if ($maintenance) { return 503; }

        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ... keep your existing headers ...
    }

# --- 3. Add these once, anywhere in the server block. The named location serves
#        the self-contained maintenance.html; error_page routes every 503 to it
#        while preserving the 503 status. The `internal` guard stops direct hits.

    error_page 503 @maintenance;

    location @maintenance {
        root /opt/cyberstars/deploy;
        rewrite ^ /maintenance.html break;
        internal;
    }
