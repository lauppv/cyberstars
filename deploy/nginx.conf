# Reference nginx config for cyber-stars.org (PERF-AUDIT P3 + P5).
#
# This is a REFERENCE to apply on the VPS — it is not read by the app. On the
# server, merge the directives below into your existing site config (usually
# /etc/nginx/sites-enabled/cyber-stars.org), keeping your real `listen 443 ssl`,
# `server_name` and certificate lines. Then:
#
#   sudo cp /etc/nginx/sites-enabled/<file> ~/nginx-backup.conf   # back up first
#   sudo nano /etc/nginx/sites-enabled/<file>                     # edit
#   sudo nginx -t && sudo systemctl reload nginx                  # test + reload
#
# What it changes vs. "proxy everything to node":
#   P3 — nginx serves the heavy static content (JS bundles, lesson markdown,
#        curriculum.json, almanac, uploads) straight from disk, so node's single
#        event loop (which orchestrates Docker code runs) no longer does that I/O.
#   P5 — gzip for text assets.
#
# IMPORTANT (guest isolation): the SPA document request (`/`) is deliberately
# still proxied to node, NOT served as a static index.html. node's middleware
# sets the per-browser `guestId` cookie on that response; serving index.html from
# disk would skip it and make shared-IP guests collide on container + run budget.

server {
    # ── KEEP your existing TLS/server identity here: ──
    #   listen 443 ssl http2;
    #   server_name cyber-stars.org;
    #   ssl_certificate     /etc/letsencrypt/live/cyber-stars.org/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/cyber-stars.org/privkey.pem;

    # ── P5: gzip for text (already-compressed binaries are skipped) ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/markdown
        application/javascript application/json
        image/svg+xml application/xml;

    # ── P3: static site served straight from disk ──
    root /opt/cyberstars/dist;

    # Only the dynamic paths go to node (prod listens on 8080).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (covers both /ws/run and /ws/presence) — keep the Upgrade headers.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # User uploads (avatars) — from disk, they live outside dist/.
    location /uploads/ {
        alias /opt/cyberstars/uploads/;
        access_log off;
        expires 7d;
    }

    # Hashed build assets cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA document → node, so the guestId cookie gets set (do NOT serve from disk).
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else: serve the file from disk if it exists (lessons/,
    # curriculum.json, almanac/, favicon), else fall through to node (which
    # returns index.html and still sets guestId).
    location / {
        try_files $uri @node;
    }
    location @node {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
