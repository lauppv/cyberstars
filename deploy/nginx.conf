# nginx for cyberstars.app, as the droplet runs it: the site's file in
# /etc/nginx/sites-enabled/. nginx is 1.24 (Ubuntu 24.04), where HTTP/2 is a
# `http2` on each `listen` (`http2 on;` only came in 1.25.1). certbot wrote the
# lines marked as its own and renews the certificate without touching them.
#
# After changing it, put it in place of the server's copy, then:
#   nginx -t && systemctl reload nginx

server {
    server_name cyberstars.app;
    client_max_body_size 3m;

    # deploy/deploy.sh creates maintenance.on before it builds and removes it
    # once the new backend answers. While it exists every request gets the
    # themed page with a 503, which search engines and the app take as "come
    # back later", and the backend is never asked.
    set $maintenance 0;
    if (-f /opt/cyberstars/maintenance.on) { set $maintenance 1; }

    # X-Maintenance tells an open tab this 503 is a deploy, not the backend's
    # own when it is busy, so the app shows its maintenance screen
    # (apps/ui/src/hooks/useMaintenance.ts). `internal` keeps direct hits out.
    error_page 503 @maintenance;
    location @maintenance {
        add_header X-Maintenance 1 always;
        root /opt/cyberstars/deploy;
        rewrite ^ /maintenance.html break;
        internal;
    }

    location /radio/ {
        alias /opt/cyberstars/media/radio/;
    }

    # The sockets for code runs, the open tabs and the user's own events.
    # They stay HTTP/1.1 under HTTP/2: the browser opens a connection of its
    # own for each.
    location /ws/ {
        if ($maintenance) { return 503; }
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else, the app's files included: the app sends their
    # compressed copies and cache headers itself (apps/api/src/middleware/static.ts).
    # nginx's own gzip (nginx.conf) covers only the pages' HTML.
    location / {
        if ($maintenance) { return 503; }
        proxy_pass http://localhost:8080;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cyberstars.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cyberstars.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP: both names go to https://cyberstars.app
server {
    if ($host = www.cyberstars.app) {
        return 301 https://cyberstars.app$request_uri;
    } # managed by Certbot

    if ($host = cyberstars.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name cyberstars.app www.cyberstars.app;
    return 404; # managed by Certbot
}

# www over HTTPS goes to the same path on cyberstars.app, so the site has one
# origin: the sockets refuse any other
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cyberstars.app;
    ssl_certificate /etc/letsencrypt/live/cyberstars.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberstars.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://cyberstars.app$request_uri;
}
