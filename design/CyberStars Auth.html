<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberStars — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#6C5CE7;--accent-glow:#6C5CE733;--bg:#0F0F14;--bg2:#16161D;--bg3:#1E1E28;--surface:#22222E;--surface2:#2A2A38;--border:#2E2E3E;--text:#E8E8F0;--text2:#9999B0;--text3:#666680;--success:#00D68F;--warning:#FFAA00;--error:#FF6B6B;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--radius:10px;--radius-sm:6px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#root{height:100%}

.auth-page{height:100%;display:flex}

/* Left panel — branding */
.auth-brand{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px;background:linear-gradient(160deg,#0F0F14 0%,#1a1040 50%,#0F0F14 100%);position:relative;overflow:hidden}
.auth-brand::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);top:30%;left:40%;transform:translate(-50%,-50%);pointer-events:none}
.brand-content{position:relative;z-index:1;max-width:400px;text-align:center}
.brand-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
.brand-logo-icon{font-size:40px;color:var(--accent);filter:drop-shadow(0 0 12px var(--accent-glow))}
.brand-logo-text{font-size:32px;font-weight:700;letter-spacing:-1px}
.brand-tagline{font-size:18px;color:var(--text2);line-height:1.6;margin-bottom:40px}
.brand-features{display:flex;flex-direction:column;gap:16px;text-align:left}
.brand-feature{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text2)}
.brand-feature-icon{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand-feature strong{color:var(--text)}

/* Code rain decoration */
.code-rain{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;opacity:.06;pointer-events:none;font-family:var(--mono);font-size:13px;color:var(--accent);line-height:1.8}
.code-col{position:absolute;top:-20%;animation:rain 18s linear infinite;white-space:pre}
.code-col:nth-child(1){left:5%;animation-duration:22s;animation-delay:0s}
.code-col:nth-child(2){left:20%;animation-duration:18s;animation-delay:-4s}
.code-col:nth-child(3){left:35%;animation-duration:25s;animation-delay:-8s}
.code-col:nth-child(4){left:55%;animation-duration:20s;animation-delay:-2s}
.code-col:nth-child(5){left:75%;animation-duration:23s;animation-delay:-6s}
.code-col:nth-child(6){left:90%;animation-duration:19s;animation-delay:-10s}
@keyframes rain{0%{transform:translateY(-100%)}100%{transform:translateY(200%)}}

/* Right panel — form */
.auth-form-panel{width:460px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding:48px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto}
.auth-tabs{display:flex;gap:0;margin-bottom:32px;background:var(--bg3);border-radius:var(--radius);padding:4px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--text3);border:none;background:none;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font);transition:all .2s}
.auth-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px #6C5CE744}
.auth-tab:not(.active):hover{color:var(--text)}

.form-group{margin-bottom:20px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:all .2s}
.form-input::placeholder{color:var(--text3)}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-input-wrap{position:relative}
.form-input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;cursor:pointer}

.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.form-checkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer}
.form-checkbox input{accent-color:var(--accent);width:16px;height:16px}
.form-link{font-size:13px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font)}
.form-link:hover{text-decoration:underline}

.btn-submit{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn-submit:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 16px #6C5CE744}
.btn-submit:active{transform:translateY(0)}
.btn-submit.loading{pointer-events:none;opacity:.8}
.btn-spinner{display:inline-block;width:18px;height:18px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.form-divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:var(--text3);font-size:12px}
.form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:var(--border)}

.form-footer{text-align:center;font-size:13px;color:var(--text3);margin-top:20px}
.form-footer a{color:var(--accent);cursor:pointer;text-decoration:none}
.form-footer a:hover{text-decoration:underline}

/* Password strength */
.pw-strength{display:flex;gap:4px;margin-top:8px}
.pw-bar{flex:1;height:3px;border-radius:2px;background:var(--bg3);transition:background .3s}
.pw-bar.weak{background:var(--error)}
.pw-bar.medium{background:var(--warning)}
.pw-bar.strong{background:var(--success)}
.pw-label{font-size:11px;color:var(--text3);margin-top:4px}

/* Success state */
.auth-success{text-align:center;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.success-icon{font-size:48px;margin-bottom:16px}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px}
.success-text{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6}

/* Responsive */
@media(max-width:900px){.auth-brand{display:none}.auth-form-panel{width:100%;border-left:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">

function AuthPage() {
  const [mode, setMode] = React.useState('login'); // login | signup | success
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [name, setName] = React.useState('');
  const [showPw, setShowPw] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [remember, setRemember] = React.useState(false);

  const pwStrength = React.useMemo(() => {
    if (password.length === 0) return 0;
    let s = 0;
    if (password.length >= 6) s++;
    if (password.length >= 10) s++;
    if (/[A-Z]/.test(password) && /[0-9]/.test(password)) s++;
    return s;
  }, [password]);

  const handleSubmit = (e) => {
    e.preventDefault();
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (mode === 'signup') {
        setMode('success');
      } else {
        window.location.href = 'CyberStars Dashboard.html';
      }
    }, 1500);
  };

  const codeSnippets = [
    "def hello():\n  print(\"Hi!\")\n  return True\n\nfor i in range(5):\n  hello()\n\nx = 42\ny = x * 2",
    "class Hero:\n  def __init__(self):\n    self.hp = 100\n    self.xp = 0\n\n  def level_up(self):\n    self.xp += 50",
    "import math\n\ndef calc(n):\n  return math.sqrt(n)\n\nresult = calc(16)\nprint(result)\n\ndata = [1,2,3]",
    "while True:\n  cmd = input()\n  if cmd == 'q':\n    break\n  process(cmd)\n\nprint(\"Done!\")",
    "nums = [3,1,4,1,5]\nnums.sort()\n\nfor n in nums:\n  print(n)\n\ntotal = sum(nums)\navg = total / len(nums)",
    "try:\n  f = open('data')\n  text = f.read()\nexcept:\n  print(\"Error\")\nfinally:\n  f.close()"
  ];

  return React.createElement('div', { className: 'auth-page' },
    /* Left brand panel */
    React.createElement('div', { className: 'auth-brand' },
      React.createElement('div', { className: 'code-rain' },
        codeSnippets.map((s, i) =>
          React.createElement('div', { key: i, className: 'code-col' }, s)
        )
      ),
      React.createElement('div', { className: 'brand-content' },
        React.createElement('div', { className: 'brand-logo' },
          React.createElement('span', { className: 'brand-logo-icon' }, '⬡'),
          React.createElement('span', { className: 'brand-logo-text' }, 'CyberStars')
        ),
        React.createElement('p', { className: 'brand-tagline' },
          'Learn to code through interactive lessons. Write real code, earn XP, and level up your skills.'
        ),
        React.createElement('div', { className: 'brand-features' },
          React.createElement('div', { className: 'brand-feature' },
            React.createElement('div', { className: 'brand-feature-icon' }, '⌨️'),
            React.createElement('span', null, React.createElement('strong', null, 'Live code editor'), ' — write & run code instantly')
          ),
          React.createElement('div', { className: 'brand-feature' },
            React.createElement('div', { className: 'brand-feature-icon' }, '🐍'),
            React.createElement('span', null, React.createElement('strong', null, 'Python, C & Java'), ' — structured curriculum')
          ),
          React.createElement('div', { className: 'brand-feature' },
            React.createElement('div', { className: 'brand-feature-icon' }, '🏆'),
            React.createElement('span', null, React.createElement('strong', null, 'XP & badges'), ' — gamified progress tracking')
          ),
          React.createElement('div', { className: 'brand-feature' },
            React.createElement('div', { className: 'brand-feature-icon' }, '✨'),
            React.createElement('span', null, React.createElement('strong', null, 'AI-powered hints'), ' — never get stuck')
          )
        )
      )
    ),

    /* Right form panel */
    React.createElement('div', { className: 'auth-form-panel' },
      mode === 'success'
        ? React.createElement('div', { className: 'auth-success' },
            React.createElement('div', { className: 'success-icon' }, '🚀'),
            React.createElement('div', { className: 'success-title' }, 'Welcome to CyberStars!'),
            React.createElement('div', { className: 'success-text' }, 'Your account is ready. Let\'s pick your first language and start coding.'),
            React.createElement('button', {
              className: 'btn-submit',
              onClick: () => { window.location.href = 'CyberStars Dashboard.html'; }
            }, 'Go to Dashboard →')
          )
        : React.createElement(React.Fragment, null,
          React.createElement('div', { className: 'auth-tabs' },
            React.createElement('button', {
              className: 'auth-tab ' + (mode === 'login' ? 'active' : ''),
              onClick: () => setMode('login')
            }, 'Log In'),
            React.createElement('button', {
              className: 'auth-tab ' + (mode === 'signup' ? 'active' : ''),
              onClick: () => setMode('signup')
            }, 'Sign Up')
          ),
          React.createElement('form', { onSubmit: handleSubmit },
            mode === 'signup' && React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Display Name'),
              React.createElement('input', {
                className: 'form-input', type: 'text', placeholder: 'Choose a username',
                value: name, onChange: e => setName(e.target.value), required: true
              })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Email'),
              React.createElement('input', {
                className: 'form-input', type: 'email', placeholder: 'you@example.com',
                value: email, onChange: e => setEmail(e.target.value), required: true
              })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Password'),
              React.createElement('div', { className: 'form-input-wrap' },
                React.createElement('input', {
                  className: 'form-input', type: showPw ? 'text' : 'password',
                  placeholder: mode === 'signup' ? 'Min. 8 characters' : 'Enter your password',
                  value: password, onChange: e => setPassword(e.target.value),
                  required: true, style: { paddingRight: 40 }
                }),
                React.createElement('span', {
                  className: 'form-input-icon',
                  onClick: () => setShowPw(!showPw)
                }, showPw ? '🙈' : '👁️')
              ),
              mode === 'signup' && password.length > 0 && React.createElement(React.Fragment, null,
                React.createElement('div', { className: 'pw-strength' },
                  [1,2,3].map(i => React.createElement('div', {
                    key: i,
                    className: 'pw-bar ' + (pwStrength >= i ? (pwStrength === 1 ? 'weak' : pwStrength === 2 ? 'medium' : 'strong') : '')
                  }))
                ),
                React.createElement('div', { className: 'pw-label' },
                  pwStrength <= 1 ? 'Weak' : pwStrength === 2 ? 'Getting better' : 'Strong password!'
                )
              )
            ),
            mode === 'login' && React.createElement('div', { className: 'form-row' },
              React.createElement('label', { className: 'form-checkbox' },
                React.createElement('input', { type: 'checkbox', checked: remember, onChange: e => setRemember(e.target.checked) }),
                'Remember me'
              ),
              React.createElement('button', { type: 'button', className: 'form-link' }, 'Forgot password?')
            ),
            React.createElement('button', {
              type: 'submit', className: 'btn-submit ' + (loading ? 'loading' : '')
            },
              loading
                ? React.createElement('span', { className: 'btn-spinner' })
                : (mode === 'login' ? 'Log In' : 'Create Account')
            )
          ),
          React.createElement('div', { className: 'form-footer' },
            mode === 'login'
              ? React.createElement('span', null, "Don't have an account? ",
                  React.createElement('a', { onClick: () => setMode('signup') }, 'Sign up free'))
              : React.createElement('span', null, 'Already have an account? ',
                  React.createElement('a', { onClick: () => setMode('login') }, 'Log in'))
          )
        )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(AuthPage));
</script>
</body>
</html>
