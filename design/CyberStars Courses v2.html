<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberStars — Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#6C5CE7;--accent-glow:#6C5CE733;--bg:#0F0F14;--bg2:#16161D;--bg3:#1E1E28;--surface:#22222E;--surface2:#2A2A38;--border:#2E2E3E;--text:#E8E8F0;--text2:#9999B0;--text3:#666680;--success:#00D68F;--warning:#FFAA00;--error:#FF6B6B;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--radius:10px;--radius-sm:6px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
#root{min-height:100%}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.logo-icon{font-size:22px;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow))}
.logo-text{font-weight:700;font-size:17px;letter-spacing:-.5px}
.topbar-nav{display:flex;gap:4px}
.nav-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;font-family:var(--font);transition:all .15s;text-decoration:none}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--accent);background:rgba(108,92,231,.07)}
.topbar-right{display:flex;align-items:center;gap:16px}
.streak-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--surface);border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600}
.user-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text);font-family:var(--font);transition:all .15s;text-decoration:none}
.user-btn:hover{background:var(--surface)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--accent)}
.user-name{font-size:13px;font-weight:600}

/* Page */
.page{max-width:1040px;margin:0 auto;padding:32px 28px 60px}
.page-header{margin-bottom:28px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.page-subtitle{font-size:14px;color:var(--text2);line-height:1.5}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-chip{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.filter-chip:hover{border-color:var(--text3);color:var(--text)}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Course grid */
.courses-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.course-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px #0004}
.course-card-banner{height:6px;width:100%}
.course-card-body{padding:20px}
.course-card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.course-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.course-meta{flex:1}
.course-name{font-size:16px;font-weight:700;margin-bottom:3px;letter-spacing:-.2px}
.course-tags{display:flex;gap:6px;flex-wrap:wrap}
.course-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--text3)}
.course-tag.beginner{background:rgba(0,214,143,.1);color:var(--success)}
.course-tag.intermediate{background:rgba(255,170,0,.1);color:var(--warning)}
.course-tag.advanced{background:rgba(255,107,107,.1);color:var(--error)}
.course-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.course-stats{display:flex;gap:16px;margin-bottom:16px}
.course-stat{font-size:11px;color:var(--text3)}
.course-stat strong{color:var(--text2)}
.course-footer{display:flex;align-items:center;justify-content:space-between}
.course-progress{flex:1;margin-right:12px}
.course-progress-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.course-progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.course-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.course-btn{padding:7px 16px;border-radius:var(--radius-sm);border:none;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;flex-shrink:0}
.course-btn.continue{background:var(--accent);color:#fff}
.course-btn.continue:hover{filter:brightness(1.1)}
.course-btn.start{background:none;border:1px solid var(--border);color:var(--text)}
.course-btn.start:hover{border-color:var(--accent);color:var(--accent)}

/* Syllabus drawer */
.syllabus-overlay{position:fixed;inset:0;background:#000a;z-index:100;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.syllabus-drawer{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100vw;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;animation:slideIn .3s cubic-bezier(.22,1,.36,1);z-index:101}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.syllabus-header{padding:24px 24px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.syllabus-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.syllabus-info{flex:1}
.syllabus-name{font-size:20px;font-weight:700;margin-bottom:4px}
.syllabus-meta{font-size:12px;color:var(--text3);display:flex;gap:12px}
.syllabus-close{background:none;border:1px solid var(--border);color:var(--text3);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.syllabus-close:hover{color:var(--text);border-color:var(--text3)}
.syllabus-desc{padding:20px 24px;font-size:13px;color:var(--text2);line-height:1.65;border-bottom:1px solid var(--border)}
.syllabus-section{padding:16px 24px}
.syllabus-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:12px}
.syllabus-chapters{display:flex;flex-direction:column;gap:2px;position:relative;padding-left:4px}
/* vertical track behind checkpoints */
.syllabus-track{position:absolute;left:21px;top:24px;bottom:24px;width:2px;background:var(--bg3);border-radius:2px;pointer-events:none}
.track-seg{position:absolute;left:0;right:0;border-radius:2px;transform-origin:top;transform:scaleY(0);animation:segIn .45s cubic-bezier(.22,1,.36,1) forwards}
.track-seg.filled{background:linear-gradient(180deg,var(--success),var(--accent));box-shadow:0 0 10px var(--accent-glow)}
.track-seg.half{background:linear-gradient(180deg,var(--success) 0%,var(--success) 45%,var(--bg3) 55%,var(--bg3) 100%)}
@keyframes segIn{to{transform:scaleY(1)}}
.syllabus-chapter{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);transition:background .15s;position:relative;opacity:0;transform:translateX(-6px);animation:chapterIn .45s cubic-bezier(.22,1,.36,1) forwards}
@keyframes chapterIn{to{opacity:1;transform:translateX(0)}}
.syllabus-chapter:hover{background:var(--surface)}
.ch-num{width:26px;height:26px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);flex-shrink:0;position:relative;z-index:1;border:2px solid var(--bg2);transition:all .2s}
.ch-num.done{background:var(--success);color:#fff;box-shadow:0 0 0 2px var(--bg2),0 0 12px rgba(0,214,143,.4)}
.ch-num.next{background:var(--bg2);color:var(--accent);border:2px solid var(--accent);animation:nextPulse 2s ease-in-out infinite}
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 2px var(--bg2),0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 2px var(--bg2),0 0 0 6px transparent,0 0 16px var(--accent-glow)}}
.syllabus-chapter.is-next .ch-name{color:var(--accent)}
.ch-info{flex:1}
.ch-name{font-size:13px;font-weight:500}
.ch-detail{font-size:11px;color:var(--text3);margin-top:1px}
.ch-xp{font-size:11px;font-weight:600;color:var(--accent)}
.syllabus-start{padding:16px 24px;border-top:1px solid var(--border)}
.syllabus-start-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.syllabus-start-btn:hover{filter:brightness(1.1)}

@media(max-width:700px){.courses-grid{grid-template-columns:1fr}.syllabus-drawer{width:100%}}
</style>
</head>

function CoursesPage() {
  const [filter, setFilter] = React.useState('all');
  const [selectedCourse, setSelectedCourse] = React.useState(null);

  const filtered = filter === 'all' ? COURSES
    : filter === 'python' ? COURSES.filter(c => c.icon === '🐍')
    : filter === 'java' ? COURSES.filter(c => c.icon === '☕')

    : filter === 'intermediate' ? COURSES.filter(c => c.level === 'intermediate')

  const syllabus = selectedCourse ? COURSES.find(c => c.id === selectedCourse) : null;

  return React.createElement('div', null,
    /* Topbar */
    React.createElement('header', { className: 'topbar' },

    ),

    React.createElement('main', { className: 'page' },
      React.createElement('div', { className: 'page-header' },
        React.createElement('h1', { className: 'page-title' }, 'Courses'),

      /* Course grid */
      React.createElement('div', { className: 'courses-grid' },

          React.createElement('div', {

            onClick: () => setSelectedCourse(c.id)

            React.createElement('div', { className: 'course-card-banner', style: { background: c.color } }),
            React.createElement('div', { className: 'course-card-body' },

                      React.createElement('div', { className: 'course-progress' },

      )
    ),

    /* Syllabus drawer */
    syllabus && React.createElement(React.Fragment, null,
      React.createElement('div', { className: 'syllabus-overlay', onClick: () => setSelectedCourse(null) }),
      React.createElement('div', { className: 'syllabus-drawer' },
        React.createElement('div', { className: 'syllabus-header' },
          React.createElement('div', { className: 'syllabus-icon', style: { background: syllabus.color + '20' } }, syllabus.icon),
          React.createElement('div', { className: 'syllabus-info' },
            React.createElement('div', { className: 'syllabus-name' }, syllabus.name),
            React.createElement('div', { className: 'syllabus-meta' },
              React.createElement('span', null, syllabus.lessons, ' lessons'),
              React.createElement('span', null, syllabus.hours, 'h estimated'),
              React.createElement('span', null, syllabus.xpTotal, ' XP total')
            )
          ),
          React.createElement('button', { className: 'syllabus-close', onClick: () => setSelectedCourse(null) }, '×')
        ),
        React.createElement('div', { className: 'syllabus-desc' }, syllabus.desc),
        React.createElement('div', { className: 'syllabus-section' },
          React.createElement('div', { className: 'syllabus-section-title' }, 'Chapters'),
          (() => {
            const total = syllabus.chapters.length;
            const nextIdx = syllabus.chapters.findIndex(ch => !ch.done);
            // build per-segment track — each segment connects checkpoint i to i+1
            const segs = [];
            for (let i = 0; i < total - 1; i++) {
              const a = syllabus.chapters[i].done, b = syllabus.chapters[i+1].done;
              let cls = '';
              if (a && b) cls = 'filled';            // both done → full connection
              else if (a && !b) cls = 'half';        // current frontier → half
              // a=false, b=true (skipped lesson) → gray gap (no class)
              segs.push({ cls, top: (i/(total-1))*100, height: (1/(total-1))*100, delay: i });
            }
            return React.createElement('div', { className: 'syllabus-chapters' },
              React.createElement('div', { className: 'syllabus-track' },
                segs.filter(s => s.cls).map((s, k) =>
                  React.createElement('div', {
                    key: k,
                    className: 'track-seg ' + s.cls,
                    style: { top: s.top + '%', height: s.height + '%', animationDelay: (0.25 + s.delay*0.08) + 's' }
                  })
                )
              ),
              syllabus.chapters.map((ch, i) => {
                const isNext = i === nextIdx;
                return React.createElement('div', {
                  key: i,
                  className: 'syllabus-chapter' + (isNext ? ' is-next' : ''),
                  style: { animationDelay: (0.05 + i * 0.04) + 's' }
                },
                  React.createElement('div', { className: 'ch-num ' + (ch.done ? 'done' : (isNext ? 'next' : '')) }, ch.done ? '✓' : i + 1),
                  React.createElement('div', { className: 'ch-info' },
                    React.createElement('div', { className: 'ch-name' }, ch.name),
                    React.createElement('div', { className: 'ch-detail' }, ch.detail)
                  ),
                  React.createElement('div', { className: 'ch-xp' }, '+', ch.xp, ' XP')
                );
              })
            );
          })()
        ),
        React.createElement('div', { className: 'syllabus-start' },
          React.createElement('button', { className: 'syllabus-start-btn', onClick: () => { window.location.href = 'CyberStars Lesson View v2.html'; } },
            syllabus.progress > 0 ? 'Continue Learning →' : 'Start Course →'
          )
        )
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(CoursesPage));
</script>
</body>
</html>
