<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberStars — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#6C5CE7;--accent-glow:#6C5CE733;--bg:#0F0F14;--bg2:#16161D;--bg3:#1E1E28;--surface:#22222E;--surface2:#2A2A38;--border:#2E2E3E;--text:#E8E8F0;--text2:#9999B0;--text3:#666680;--success:#00D68F;--warning:#FFAA00;--error:#FF6B6B;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--radius:10px;--radius-sm:6px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
#root{min-height:100%}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.logo-icon{font-size:22px;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow))}
.logo-text{font-weight:700;font-size:17px;letter-spacing:-.5px}
.topbar-nav{display:flex;gap:4px}
.nav-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;font-family:var(--font);transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--accent);background:var(--accent)12}
.topbar-right{display:flex;align-items:center;gap:16px}
.streak-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--surface);border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600}
.user-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text);font-family:var(--font);transition:all .15s}
.user-btn:hover{background:var(--surface)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--accent)}
.user-name{font-size:13px;font-weight:600}

/* Main content */
.dashboard{max-width:1040px;margin:0 auto;padding:28px 28px 48px}

/* Welcome hero */
.hero{display:flex;align-items:center;justify-content:space-between;padding:28px 32px;background:linear-gradient(135deg,var(--bg3) 0%,#1a1040 100%);border:1px solid var(--border);border-radius:14px;margin-bottom:28px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);right:-80px;top:-80px;pointer-events:none}
.hero-text{position:relative;z-index:1}
.hero-greeting{font-size:13px;color:var(--text3);margin-bottom:4px}
.hero-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero-subtitle{font-size:14px;color:var(--text2);line-height:1.5}
.hero-stats{display:flex;gap:20px;position:relative;z-index:1}
.hero-stat{text-align:center;padding:12px 20px;background:var(--bg)80;border-radius:var(--radius);border:1px solid var(--border);backdrop-filter:blur(8px);min-width:90px}
.hero-stat-value{font-size:22px;font-weight:700}
.hero-stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.hero-stat-value.xp{color:var(--accent)}
.hero-stat-value.streak{color:var(--warning)}
.hero-stat-value.level{color:var(--success)}

/* XP bar mini */
.xp-mini{margin-bottom:28px}
.xp-mini-row{display:flex;align-items:center;gap:12px}
.xp-mini-label{font-size:11px;color:var(--text3);white-space:nowrap}
.xp-mini-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;max-width:260px}
.xp-mini-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a855f7);border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1)}

/* Section headers */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.section-link{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font);font-weight:500}
.section-link:hover{text-decoration:underline}

/* Continue learning card */
.continue-card{display:flex;gap:20px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:28px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.continue-card:hover{border-color:var(--accent);box-shadow:0 4px 20px #0004}
.continue-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:2px 0 0 2px}
.continue-icon{width:52px;height:52px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.continue-info{flex:1;min-width:0}
.continue-badge{display:inline-block;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent)15;padding:2px 8px;border-radius:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.continue-title{font-size:15px;font-weight:600;margin-bottom:3px}
.continue-desc{font-size:12px;color:var(--text3)}
.continue-progress{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;flex-shrink:0}
.continue-pct{font-size:13px;font-weight:700;color:var(--accent)}
.continue-bar{width:100px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.continue-fill{height:100%;background:var(--accent);border-radius:2px}
.continue-btn{padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.continue-btn:hover{filter:brightness(1.1)}

/* Course grid */
.courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px}
.course-card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.course-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px #0004}
.course-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.course-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.course-meta{flex:1}
.course-name{font-size:14px;font-weight:600;margin-bottom:2px}
.course-lessons{font-size:11px;color:var(--text3)}
.course-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:14px;flex:1}
.course-footer{display:flex;align-items:center;justify-content:space-between}
.course-progress-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-right:10px}
.course-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.course-pct{font-size:11px;font-weight:600;color:var(--text3)}
.course-start-btn{padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;color:var(--text);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.course-start-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Bottom row: two columns */
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* Activity feed */
.activity-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.activity-list{display:flex;flex-direction:column;gap:12px}
.activity-item{display:flex;align-items:center;gap:10px;font-size:13px}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.activity-text{flex:1;color:var(--text2)}
.activity-text strong{color:var(--text);font-weight:600}
.activity-time{font-size:11px;color:var(--text3);white-space:nowrap}

/* Leaderboard */
.leaderboard-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);transition:background .15s}
.lb-row:hover{background:var(--surface2)}
.lb-row.me{background:var(--accent)10;border:1px solid var(--accent)30}
.lb-rank{width:24px;font-size:13px;font-weight:700;text-align:center;color:var(--text3)}
.lb-rank.gold{color:var(--warning)}
.lb-rank.silver{color:#C0C0C0}
.lb-rank.bronze{color:#CD7F32}
.lb-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px}
.lb-name{flex:1;font-size:13px;font-weight:500}
.lb-xp{font-size:12px;font-weight:600;color:var(--accent)}

/* Onboarding tour */
.tour-overlay{position:fixed;inset:0;background:#000c;z-index:200;display:flex;align-items:center;justify-content:center}
.tour-modal{width:480px;max-width:92vw;background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:modalIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
.tour-content{padding:36px 32px;text-align:center}
.tour-icon{font-size:48px;margin-bottom:16px}
.tour-title{font-size:22px;font-weight:700;margin-bottom:8px}
.tour-text{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:24px}
.tour-dots{display:flex;justify-content:center;gap:6px;margin-bottom:24px}
.tour-dot{width:8px;height:8px;border-radius:50%;background:var(--bg3);transition:all .2s}
.tour-dot.active{background:var(--accent);width:20px;border-radius:4px}
.tour-actions{display:flex;gap:10px;justify-content:center}
.tour-skip{padding:10px 20px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.tour-skip:hover{color:var(--text);border-color:var(--text3)}
.tour-next{padding:10px 24px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.tour-next:hover{filter:brightness(1.1)}

@media(max-width:768px){.courses-grid{grid-template-columns:1fr}.bottom-row{grid-template-columns:1fr}.hero{flex-direction:column;gap:20px}.hero-stats{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">

const TOUR_STEPS = [
  { icon: '👋', title: 'Welcome to CyberStars!', text: 'We\'re excited to have you. Let\'s take a quick tour of the platform so you know where everything is.' },
  { icon: '📚', title: 'Choose Your Path', text: 'Pick from Python, Java, or C. Each course has structured lessons that build on each other — from basics to advanced topics.' },
  { icon: '⌨️', title: 'Code as You Learn', text: 'Every lesson has a built-in code editor. Read the explanation on the left, then practice on the right — no setup needed.' },
  { icon: '🏆', title: 'Earn XP & Badges', text: 'Complete lessons to earn XP, maintain your daily streak, and unlock badges. Climb the leaderboard and show off your skills!' },
  { icon: '✨', title: 'Never Get Stuck', text: 'Our AI-powered hints are always one click away. Ask CyberBot for help whenever you need a nudge in the right direction.' },
];

function OnboardingTour({ onFinish }) {
  const [step, setStep] = React.useState(0);
  const s = TOUR_STEPS[step];

  return React.createElement('div', { className: 'tour-overlay' },
    React.createElement('div', { className: 'tour-modal' },
      React.createElement('div', { className: 'tour-content' },
        React.createElement('div', { className: 'tour-icon' }, s.icon),
        React.createElement('div', { className: 'tour-title' }, s.title),
        React.createElement('div', { className: 'tour-text' }, s.text),
        React.createElement('div', { className: 'tour-dots' },
          TOUR_STEPS.map((_, i) =>
            React.createElement('div', { key: i, className: 'tour-dot ' + (i === step ? 'active' : '') })
          )
        ),
        React.createElement('div', { className: 'tour-actions' },
          React.createElement('button', { className: 'tour-skip', onClick: onFinish }, 'Skip'),
          React.createElement('button', { className: 'tour-next', onClick: () => {
            if (step < TOUR_STEPS.length - 1) setStep(step + 1);
            else onFinish();
          }}, step < TOUR_STEPS.length - 1 ? 'Next →' : 'Get Started!')
        )
      )
    )
  );
}

function DashboardApp() {
  const [showTour, setShowTour] = React.useState(() => {
    return !localStorage.getItem('cyberstars_toured');
  });
  const [activeNav, setActiveNav] = React.useState('dashboard');

  const finishTour = () => {
    localStorage.setItem('cyberstars_toured', '1');
    setShowTour(false);
  };

  const courses = [
    { icon: '🐍', name: 'Python Fundamentals', lessons: 12, progress: 17, color: '#3572A5',
      desc: 'Variables, loops, functions, and your first real programs.' },
    { icon: '☕', name: 'Java Basics', lessons: 14, progress: 5, color: '#b07219',
      desc: 'Object-oriented programming from the ground up.' },
    { icon: '⚙️', name: 'C Programming', lessons: 10, progress: 0, color: '#555555',
      desc: 'Memory, pointers, and low-level system programming.' },
  ];

  const leaderboard = [
    { name: 'Maya', emoji: '🦊', xp: 2450 },
    { name: 'Kai', emoji: '🐺', xp: 2180 },
    { name: 'Alex', emoji: '🚀', xp: 1920, me: true },
    { name: 'Sam', emoji: '🦉', xp: 1740 },
    { name: 'Zara', emoji: '🐱', xp: 1580 },
  ];

  const activity = [
    { color: 'var(--success)', text: React.createElement(React.Fragment, null, 'Completed ', React.createElement('strong', null, 'Variables & Data Types')), time: '2h ago' },
    { color: 'var(--accent)', text: React.createElement(React.Fragment, null, 'Earned badge ', React.createElement('strong', null, '🐍 First Code')), time: '2h ago' },
    { color: 'var(--warning)', text: React.createElement(React.Fragment, null, 'Reached ', React.createElement('strong', null, '5-day streak!')), time: '1d ago' },
    { color: 'var(--accent)', text: React.createElement(React.Fragment, null, 'Leveled up to ', React.createElement('strong', null, 'Level 4')), time: '1d ago' },
    { color: 'var(--success)', text: React.createElement(React.Fragment, null, 'Completed ', React.createElement('strong', null, 'Intro to Python')), time: '2d ago' },
  ];

  return React.createElement('div', null,
    /* Topbar */
    React.createElement('header', { className: 'topbar' },
      React.createElement('div', { className: 'topbar-left' },
        React.createElement('a', { className: 'logo', href: '#' },
          React.createElement('span', { className: 'logo-icon' }, '⬡'),
          React.createElement('span', { className: 'logo-text' }, 'CyberStars')
        ),
        React.createElement('nav', { className: 'topbar-nav' },
          ['Dashboard', 'Courses', 'Challenges'].map(item =>
            React.createElement('button', {
              key: item,
              className: 'nav-item ' + (activeNav === item.toLowerCase() ? 'active' : ''),
              onClick: () => setActiveNav(item.toLowerCase())
            }, item)
          )
        )
      ),
      React.createElement('div', { className: 'topbar-right' },
        React.createElement('div', { className: 'streak-pill' },
          React.createElement('span', null, '🔥'),
          React.createElement('span', null, '5 days')
        ),
        React.createElement('button', { className: 'user-btn' },
          React.createElement('div', { className: 'user-avatar' }, '🚀'),
          React.createElement('span', { className: 'user-name' }, 'Alex')
        )
      )
    ),

    /* Dashboard content */
    React.createElement('main', { className: 'dashboard' },
      /* Welcome hero */
      React.createElement('div', { className: 'hero' },
        React.createElement('div', { className: 'hero-text' },
          React.createElement('div', { className: 'hero-greeting' }, 'Good evening,'),
          React.createElement('h1', { className: 'hero-title' }, 'Welcome back, Alex'),
          React.createElement('p', { className: 'hero-subtitle' }, 'You\'re on a 5-day streak. Keep it going!')
        ),
        React.createElement('div', { className: 'hero-stats' },
          React.createElement('div', { className: 'hero-stat' },
            React.createElement('div', { className: 'hero-stat-value xp' }, '1,920'),
            React.createElement('div', { className: 'hero-stat-label' }, 'Total XP')
          ),
          React.createElement('div', { className: 'hero-stat' },
            React.createElement('div', { className: 'hero-stat-value streak' }, '5'),
            React.createElement('div', { className: 'hero-stat-label' }, 'Day Streak')
          ),
          React.createElement('div', { className: 'hero-stat' },
            React.createElement('div', { className: 'hero-stat-value level' }, '4'),
            React.createElement('div', { className: 'hero-stat-label' }, 'Level')
          )
        )
      ),

      /* XP progress */
      React.createElement('div', { className: 'xp-mini' },
        React.createElement('div', { className: 'xp-mini-row' },
          React.createElement('span', { className: 'xp-mini-label' }, '⭐ Level 4 — 120 / 300 XP to next'),
          React.createElement('div', { className: 'xp-mini-track' },
            React.createElement('div', { className: 'xp-mini-fill', style: { width: '40%' } })
          )
        )
      ),

      /* Continue learning */
      React.createElement('div', { className: 'section-header' },
        React.createElement('div', { className: 'section-title' }, 'Continue Learning')
      ),
      React.createElement('div', {
        className: 'continue-card',
        onClick: () => { window.location.href = 'CyberStars Lesson View v2.html'; }
      },
        React.createElement('div', { className: 'continue-icon', style: { background: '#3572A520' } }, '🐍'),
        React.createElement('div', { className: 'continue-info' },
          React.createElement('div', { className: 'continue-badge' }, 'Python Fundamentals'),
          React.createElement('div', { className: 'continue-title' }, 'Ch. 3: Loops & Iteration'),
          React.createElement('div', { className: 'continue-desc' }, 'Up next: for loops, while loops, and the range() function')
        ),
        React.createElement('div', { className: 'continue-progress' },
          React.createElement('div', { className: 'continue-pct' }, '17%'),
          React.createElement('div', { className: 'continue-bar' },
            React.createElement('div', { className: 'continue-fill', style: { width: '17%' } })
          ),
          React.createElement('button', { className: 'continue-btn' }, 'Continue →')
        )
      ),

      /* Courses */
      React.createElement('div', { className: 'section-header' },
        React.createElement('div', { className: 'section-title' }, 'Your Courses'),
        React.createElement('button', { className: 'section-link' }, 'View all →')
      ),
      React.createElement('div', { className: 'courses-grid' },
        courses.map((c, i) =>
          React.createElement('div', { key: i, className: 'course-card' },
            React.createElement('div', { className: 'course-card-top' },
              React.createElement('div', { className: 'course-icon', style: { background: c.color + '20' } }, c.icon),
              React.createElement('div', { className: 'course-meta' },
                React.createElement('div', { className: 'course-name' }, c.name),
                React.createElement('div', { className: 'course-lessons' }, c.lessons, ' lessons')
              )
            ),
            React.createElement('div', { className: 'course-desc' }, c.desc),
            React.createElement('div', { className: 'course-footer' },
              c.progress > 0
                ? React.createElement(React.Fragment, null,
                    React.createElement('div', { className: 'course-progress-bar' },
                      React.createElement('div', { className: 'course-progress-fill', style: { width: c.progress + '%', background: c.color } })
                    ),
                    React.createElement('span', { className: 'course-pct' }, c.progress, '%')
                  )
                : React.createElement('button', { className: 'course-start-btn' }, 'Start Course →')
            )
          )
        )
      ),

      /* Bottom row */
      React.createElement('div', { className: 'bottom-row' },
        /* Recent Activity */
        React.createElement('div', { className: 'activity-card' },
          React.createElement('div', { className: 'section-header', style: { marginBottom: 14 } },
            React.createElement('div', { className: 'section-title' }, 'Recent Activity')
          ),
          React.createElement('div', { className: 'activity-list' },
            activity.map((a, i) =>
              React.createElement('div', { key: i, className: 'activity-item' },
                React.createElement('div', { className: 'activity-dot', style: { background: a.color } }),
                React.createElement('div', { className: 'activity-text' }, a.text),
                React.createElement('div', { className: 'activity-time' }, a.time)
              )
            )
          )
        ),

        /* Leaderboard */
        React.createElement('div', { className: 'leaderboard-card' },
          React.createElement('div', { className: 'section-header', style: { marginBottom: 14 } },
            React.createElement('div', { className: 'section-title' }, 'Leaderboard'),
            React.createElement('button', { className: 'section-link' }, 'Full rankings →')
          ),
          React.createElement('div', { className: 'lb-list' },
            leaderboard.map((p, i) =>
              React.createElement('div', { key: i, className: 'lb-row ' + (p.me ? 'me' : '') },
                React.createElement('div', { className: 'lb-rank ' + (i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '') }, i + 1),
                React.createElement('div', { className: 'lb-avatar' }, p.emoji),
                React.createElement('div', { className: 'lb-name' }, p.name, p.me ? ' (you)' : ''),
                React.createElement('div', { className: 'lb-xp' }, p.xp.toLocaleString(), ' XP')
              )
            )
          )
        )
      )
    ),

    /* Onboarding tour */
    showTour && React.createElement(OnboardingTour, { onFinish: finishTour })
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(DashboardApp));
</script>
</body>
</html>
