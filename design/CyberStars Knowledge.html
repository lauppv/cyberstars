<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberStars — Knowledge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#6C5CE7;--accent2:#8B7FF0;--accent-glow:#6C5CE733;--bg:#0F0F14;--bg2:#16161D;--bg3:#1E1E28;--surface:#22222E;--surface2:#2A2A38;--border:#2E2E3E;--text:#E8E8F0;--text2:#9999B0;--text3:#666680;--success:#00D68F;--warning:#FFAA00;--error:#FF6B6B;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--serif:'Fraunces',Georgia,serif;--radius:10px;--radius-sm:6px}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
#root{min-height:100%;position:relative;z-index:1}
a{color:inherit;text-decoration:none}

/* ===== Cosmos bg (same as forum) ===== */
#cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#1a1040 0%,#0a0818 45%,#06050d 100%)}
#cosmos canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.nebula{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;mix-blend-mode:screen;pointer-events:none;will-change:transform}
.nebula.n1{width:520px;height:520px;background:radial-gradient(circle,#6C5CE7 0%,transparent 65%);top:-120px;left:-100px;animation:drift1 38s ease-in-out infinite alternate}
.nebula.n2{width:680px;height:680px;background:radial-gradient(circle,#FF6B6B 0%,transparent 60%);bottom:-200px;right:-180px;animation:drift2 46s ease-in-out infinite alternate;opacity:.22}
.nebula.n3{width:420px;height:420px;background:radial-gradient(circle,#00D68F 0%,transparent 65%);top:40%;left:55%;animation:drift3 52s ease-in-out infinite alternate;opacity:.18}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-160px,-90px) scale(1.2)}}
@keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(-90px,120px) scale(.85)}}

/* ===== Topbar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:rgba(22,22,29,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{font-size:22px;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow))}
.logo-text{font-weight:700;font-size:17px;letter-spacing:-.5px}
.topbar-nav{display:flex;gap:4px}
.nav-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;font-family:var(--font);transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--accent);background:rgba(108,92,231,.08)}
.topbar-right{display:flex;align-items:center;gap:16px}
.streak-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--surface);border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600}
.user-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text);font-family:var(--font);transition:all .15s}
.user-btn:hover{background:var(--surface)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--accent)}
.user-name{font-size:13px;font-weight:600}

/* ===== Page shell ===== */
.page{max-width:1140px;margin:0 auto;padding:36px 28px 60px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:2.5px;font-weight:700;margin-bottom:14px}
.kicker::before{content:'';width:24px;height:1px;background:var(--accent)}
.page-title{font-family:var(--serif);font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:14px;background:linear-gradient(180deg,#fff 0%,#a8b0d4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-subtitle{font-size:16px;color:var(--text2);line-height:1.6;max-width:640px}
.page-header{margin-bottom:40px}

/* Filter chips */
.filters{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:rgba(22,22,29,.6);backdrop-filter:blur(8px);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.filter-chip:hover{border-color:var(--text3);color:var(--text)}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.filter-chip .em{font-size:13px}

/* ===== Hero featured ===== */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:rgba(22,22,29,.6);backdrop-filter:blur(10px);margin-bottom:48px;min-height:380px;cursor:pointer;transition:all .3s;position:relative}
.hero:hover{border-color:var(--accent);box-shadow:0 16px 60px rgba(108,92,231,.2)}
.hero-art{position:relative;overflow:hidden;min-height:380px}
.hero-art-bg{position:absolute;inset:0;background:linear-gradient(135deg,#000814 0%,#001d3d 60%,#003566 100%)}
.hero-art-stars{position:absolute;inset:0}
.hero-art-stars::before,.hero-art-stars::after{content:'';position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:32px 18px #fff,84px 47px #fff,143px 88px #b0e0ff,210px 32px #fff,46px 145px #fff,178px 165px #fff,260px 122px #ffd1a1,310px 60px #fff,90px 220px #b0e0ff,200px 250px #fff,340px 200px #fff,420px 90px #fff,380px 270px #b0e0ff,440px 180px #fff,80px 310px #fff,260px 290px #ffd1a1;animation:twinkle 4s ease-in-out infinite}
.hero-art-stars::after{animation-delay:2s;opacity:.6;top:30px;left:20px}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.4}}
.hero-art-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;filter:drop-shadow(0 8px 40px rgba(0,0,0,.6));animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero-art-badge{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:6px 14px;border-radius:20px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;letter-spacing:1.5px;border:1px solid rgba(255,255,255,.15)}
.hero-content{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.hero-cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.hero-title{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-1px;margin-bottom:14px;text-wrap:pretty}
.hero-excerpt{font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:22px;text-wrap:pretty}
.hero-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text3)}
.hero-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text3)}
.hero-author{display:flex;align-items:center;gap:8px;color:var(--text2)}
.hero-author-avatar{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px}

/* ===== Main grid: articles + sidebar ===== */
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:flex-start;margin-bottom:48px}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px}
.section-head h2{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.5px}
.section-head .meta{font-size:12px;color:var(--text3)}

/* Article grid */
.articles{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.article{background:rgba(22,22,29,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column}
.article:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.5)}
.article-art{position:relative;height:160px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px}
.article-art-grad{position:absolute;inset:0;opacity:.95}
.article-art .emoji{position:relative;z-index:1;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5));transition:transform .3s}
.article:hover .article-art .emoji{transform:scale(1.08)}
.article-art-tag{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:12px;letter-spacing:1px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px);z-index:2}
.article-art-year{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:12px;letter-spacing:.5px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px);z-index:2}
.article-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column}
.article-title{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.3px;margin-bottom:8px;text-wrap:pretty}
.article-excerpt{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px;flex:1;text-wrap:pretty}
.article-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--text3)}
.article-author{display:flex;align-items:center;gap:6px}
.article-author-av{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px}
.article-stats{display:flex;gap:10px;align-items:center}
.article-xp{color:var(--accent);font-weight:700;font-family:var(--mono)}

/* ===== Sidebar ===== */
.sidebar{display:flex;flex-direction:column;gap:20px;position:sticky;top:80px}
.side-card{background:rgba(22,22,29,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:22px;position:relative;overflow:hidden}
.side-card h3{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.side-card h3 .blip{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* Fun fact card */
.factcard{position:relative;background:linear-gradient(135deg,rgba(108,92,231,.15) 0%,rgba(255,107,107,.08) 100%);border:1px solid rgba(108,92,231,.25)}
.factcard::after{content:'';position:absolute;width:140px;height:140px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 65%);right:-40px;top:-40px;pointer-events:none}
.fact-emoji{font-size:34px;margin-bottom:10px;display:block}
.fact-text{font-family:var(--serif);font-size:17px;line-height:1.45;font-weight:600;letter-spacing:-.2px;text-wrap:pretty;position:relative;z-index:1}
.fact-source{font-size:11px;color:var(--text3);margin-top:12px;font-family:var(--mono);position:relative;z-index:1}
.fact-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;position:relative;z-index:1}
.fact-btn{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:13px;transition:all .15s}
.fact-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.fact-pips{display:flex;gap:5px}
.fact-pip{width:6px;height:6px;border-radius:50%;background:var(--bg3);transition:all .2s}
.fact-pip.active{background:var(--accent);width:16px;border-radius:3px}

/* On this day timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);position:relative}
.tl-item:last-child{border-bottom:none}
.tl-year{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.tl-event{font-size:12.5px;color:var(--text2);line-height:1.5;text-wrap:pretty}
.tl-event strong{color:var(--text);font-weight:600}

/* Hall of legends */
.legends{display:flex;flex-direction:column;gap:10px}
.legend{display:flex;align-items:center;gap:11px;padding:8px;border-radius:var(--radius-sm);transition:background .15s;cursor:pointer}
.legend:hover{background:var(--surface)}
.legend-av{width:38px;height:38px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--border);flex-shrink:0}
.legend-info{flex:1;min-width:0}
.legend-name{font-size:13px;font-weight:600;letter-spacing:-.1px}
.legend-desc{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Quote of day */
.quote-card{padding:24px;background:linear-gradient(135deg,rgba(0,214,143,.08) 0%,rgba(108,92,231,.06) 100%);border:1px solid rgba(0,214,143,.18)}
.quote-mark{font-family:var(--serif);font-size:48px;color:var(--success);line-height:1;margin-bottom:-10px;opacity:.5}
.quote-text{font-family:var(--serif);font-size:16px;line-height:1.5;font-weight:600;font-style:italic;letter-spacing:-.2px;margin-bottom:12px;text-wrap:pretty}
.quote-author{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
.quote-author strong{color:var(--text);font-weight:600}

/* ===== Big timeline section ===== */
.bigtl-section{margin-bottom:56px}
.bigtl{position:relative;padding-left:34px;border-left:2px dashed var(--border);margin-top:24px}
.bigtl-item{position:relative;padding-bottom:28px}
.bigtl-item:last-child{padding-bottom:0}
.bigtl-dot{position:absolute;left:-44px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 0 4px var(--bg),0 0 16px var(--accent-glow)}
.bigtl-year{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.8px;margin-bottom:6px}
.bigtl-title{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px;line-height:1.25}
.bigtl-text{font-size:14px;color:var(--text2);line-height:1.65;max-width:680px;text-wrap:pretty}
.bigtl-tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:8px;padding:3px 8px;background:var(--bg3);border-radius:6px}

/* Compact reading-list strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:32px}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.strip-card{flex:0 0 280px;background:rgba(22,22,29,.72);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .2s}
.strip-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.strip-cat{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:1.3px;font-weight:700;margin-bottom:6px}
.strip-title{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:6px;letter-spacing:-.2px}
.strip-meta{font-size:11px;color:var(--text3)}

@media(max-width:900px){.main-grid{grid-template-columns:1fr}.sidebar{position:static}.hero{grid-template-columns:1fr}.hero-art{min-height:200px}.articles{grid-template-columns:1fr}.page-title{font-size:42px}}
</style>
</head>
<body>
<div id="cosmos">
  <canvas id="starfield"></canvas>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
</div>
<div id="root"></div>

<script>
// Static starfield with very slow twinkling — calm, reading-friendly
(() => {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const stars = [];
  const NUM_STARS = 260;
  const COLORS = ['#ffffff','#cfd9ff','#ffd1a1','#a8c4ff','#e8b8ff'];

  function regenStars() {
    stars.length = 0;
    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() < 0.85 ? 0.5 + Math.random() * 1.2 : 1.6 + Math.random() * 1.4,
        baseAlpha: 0.35 + Math.random() * 0.55,
        // very slow twinkle: period 8–20 seconds
        twPhase: Math.random() * Math.PI * 2,
        twSpeed: 0.00015 + Math.random() * 0.0004,  // rad/ms
        twAmp: 0.15 + Math.random() * 0.35,         // how much it varies
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }
  }

  function resize() {
    w = canvas.clientWidth = window.innerWidth;
    h = canvas.clientHeight = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    regenStars();
  }
  window.addEventListener('resize', resize);
  resize();

  function frame(now) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = Math.sin(s.twPhase + now * s.twSpeed);
      const alpha = Math.max(0.05, s.baseAlpha + tw * s.twAmp);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      if (s.size > 1.6) {
        ctx.globalAlpha = alpha * 0.22;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

const { useState } = React;

// ===== Data =====

const HERO = {

  author: 'Editorial Team', authorEmoji: '✨',
  readTime: '8 min', date: 'May 14, 2026',

};

const ARTICLES = [
  { cat:'history', tag:'HISTORY', year:'1969', emoji:'📞', grad:'linear-gradient(135deg,#1a1a40,#3a1f70)',
    title:'The night the internet said its first word',
