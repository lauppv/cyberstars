<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberStars — Learn to Code</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --accent: #6C5CE7;
  --accent-glow: #6C5CE733;
  --bg: #0F0F14;
  --bg2: #16161D;
  --bg3: #1E1E28;
  --surface: #22222E;
  --surface2: #2A2A38;
  --border: #2E2E3E;
  --text: #E8E8F0;
  --text2: #9999B0;
  --text3: #666680;
  --success: #00D68F;
  --warning: #FFAA00;
  --error: #FF6B6B;
  --font: 'Space Grotesk', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius: 10px;
  --radius-sm: 6px;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent);text-decoration:none}

/* ── Light theme overrides ── */
.app.light {
  --bg: #F5F5FA;
  --bg2: #EDEDF4;
  --bg3: #E2E2EE;
  --surface: #FFFFFF;
  --surface2: #F0F0F8;
  --border: #D8D8E8;
  --text: #1A1A2E;
  --text2: #6666A0;
  --text3: #9999B0;
}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-right{display:flex;align-items:center;gap:20px}
.sidebar-toggle{background:none;border:1px solid var(--border);color:var(--text3);width:28px;height:28px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.sidebar-toggle:hover{color:var(--text);border-color:var(--text3)}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{font-size:20px;color:var(--accent);filter:drop-shadow(0 0 6px var(--accent-glow))}
.logo-text{font-weight:700;font-size:16px;letter-spacing:-0.5px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3)}
.bc-course{color:var(--text2)}
.bc-sep{opacity:.4}
.bc-lesson{color:var(--text)}

/* ── User ── */
.user-avatar{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar-img{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--accent)}
.avatar-name{font-size:13px;font-weight:600}

/* ── XP Bar ── */
.xp-bar-wrap{padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.xp-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.xp-level{color:var(--warning);font-weight:600}
.xp-numbers{color:var(--text3)}
.xp-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a855f7);border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1)}

/* ── Streak ── */
.streak-widget{display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--surface);border-radius:20px;border:1px solid var(--border)}
.streak-flame{font-size:16px}
.streak-count{font-size:12px;font-weight:600;white-space:nowrap}
.streak-days{display:flex;gap:3px}
.streak-day{width:18px;height:18px;border-radius:4px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--text3)}
.streak-day.active{background:var(--accent);color:#fff}

/* ── Main Layout ── */
.main-layout{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-header{padding:16px 16px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600}
.lesson-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.lesson-nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.lesson-nav-item:hover{background:var(--surface);color:var(--text)}
.lesson-nav-item.active{background:var(--accent)18;color:var(--accent);font-weight:600}
.lesson-nav-item.completed{color:var(--success)}
.nav-marker{width:24px;height:24px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.lesson-nav-item.active .nav-marker{background:var(--accent);color:#fff}
.lesson-nav-item.completed .nav-marker{background:var(--success);color:#fff}

.sidebar-progress{margin:auto 16px 12px;padding-top:12px;border-top:1px solid var(--border)}
.sp-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.sp-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.sp-fill{height:100%;background:var(--success);border-radius:2px;transition:width .4s}

.sidebar-badges{padding:12px 16px;border-top:1px solid var(--border)}
.badges-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600;margin-bottom:10px}
.badges-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);transition:all .2s}
.badge.earned{border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.badge.locked{opacity:.4;filter:grayscale(1)}
.badge-icon{font-size:20px}
.badge-label{font-size:9px;font-weight:600;color:var(--text2);text-align:center}

/* ── Content Split ── */
.content-split{flex:1;display:flex;overflow:hidden}
.lesson-content{flex:1;min-width:0;overflow-y:auto;padding:32px 36px;scroll-behavior:smooth}
.lesson-content::-webkit-scrollbar{width:6px}
.lesson-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.lesson-header{margin-bottom:24px}
.section-badge{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent)15;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.lesson-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1.2}
.challenge-badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--warning);background:var(--warning)15;padding:4px 12px;border-radius:20px}

.lesson-body{font-size:15px;line-height:1.75;color:var(--text2);margin-bottom:24px}
.lesson-body p{margin-bottom:12px}
.lesson-body strong{color:var(--text);font-weight:600}
.lesson-body code{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:2px 6px;border-radius:4px;color:var(--accent)}
.md-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.md-table th,.md-table td{padding:8px 12px;border:1px solid var(--border);text-align:left}
.md-table th{background:var(--surface);font-weight:600;color:var(--text)}
.md-table td{color:var(--text2)}

.tip-box{display:flex;gap:12px;padding:14px 16px;background:var(--accent)0A;border:1px solid var(--accent)30;border-radius:var(--radius);margin:20px 0}
.tip-icon{font-size:20px;flex-shrink:0}
.tip-text{font-size:13px;color:var(--text2);line-height:1.6}

.lesson-nav-buttons{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.btn-nav{padding:8px 20px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-nav:disabled{opacity:.3;cursor:not-allowed}
.btn-nav.next{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-nav.next:hover:not(:disabled){filter:brightness(1.1)}

/* ── Editor Panel ── */
.editor-panel{width:46%;max-width:560px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--bg2)}
.editor-panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)}
.editor-panel-actions{display:flex;gap:8px}
.btn-reset{background:none;border:none;color:var(--text3);font-size:12px;font-family:var(--font);cursor:pointer;padding:4px 8px;border-radius:4px;transition:all .15s}
.btn-reset:hover{color:var(--text);background:var(--surface)}

/* ── Code Editor ── */
.code-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border)}
.editor-lang-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text2)}
.lang-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.editor-actions{display:flex;gap:6px}
.btn-hint,.btn-run{padding:5px 12px;border-radius:var(--radius-sm);border:none;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s}
.btn-hint{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.btn-hint:hover{color:var(--accent);border-color:var(--accent)}
.btn-run{background:var(--success);color:#000}
.btn-run:hover{filter:brightness(1.1)}
.btn-run:disabled{opacity:.6;cursor:not-allowed}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #0004;border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.editor-body{flex:1;display:flex;overflow:hidden;position:relative;background:#0D1117;min-height:200px}
.app.light .editor-body{background:#FAFBFE}
.line-numbers{padding:12px 0;width:40px;flex-shrink:0;text-align:right;background:#0D111780;border-right:1px solid #1E2430}
.app.light .line-numbers{background:#F0F1F6;border-right-color:#E0E2EE}
.line-num{padding:0 8px;font-family:var(--mono);font-size:13px;line-height:1.65;color:#444D60;user-select:none}
.editor-code-area{flex:1;position:relative;overflow:auto}
.editor-highlight,.editor-textarea{position:absolute;top:0;left:0;width:100%;height:100%;padding:12px;font-family:var(--mono);font-size:13px;line-height:1.65;tab-size:4;white-space:pre;overflow:auto}
.editor-highlight{color:var(--text);pointer-events:none;z-index:1}
.editor-textarea{color:transparent;caret-color:var(--text);background:transparent;border:none;outline:none;resize:none;z-index:2;-webkit-text-fill-color:transparent}
.app.light .editor-textarea{caret-color:#1A1A2E}

/* Syntax colors */
.syn-kw{color:#FF79C6}
.syn-str{color:#F1FA8C}
.syn-num{color:#BD93F9}
.syn-cmt{color:#6272A4;font-style:italic}
.app.light .syn-kw{color:#8B5CF6}
.app.light .syn-str{color:#059669}
.app.light .syn-num{color:#D97706}
.app.light .syn-cmt{color:#9CA3AF;font-style:italic}

/* ── AI Hint Bar ── */
.ai-hint-bar{background:linear-gradient(135deg,#1a1a2e,#16213e);border-top:1px solid var(--accent)40;padding:10px 14px;animation:slideUp .3s ease}
.app.light .ai-hint-bar{background:linear-gradient(135deg,#EEF0FF,#E8ECFF)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ai-hint-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ai-hint-header span{font-size:12px;font-weight:600;color:var(--accent)}
.hint-close{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px}
.ai-hint-text{font-size:13px;line-height:1.6;color:var(--text2)}
.ai-hint-loading{font-size:12px;color:var(--text3)}
.dot-pulse{display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ── Output ── */
.editor-output{border-top:1px solid var(--border);background:#0A0E14;padding:10px 14px;max-height:120px;overflow-y:auto}
.app.light .editor-output{background:#F0F1F6}
.output-header{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.output-text{font-family:var(--mono);font-size:12px;color:var(--success);line-height:1.6;white-space:pre-wrap}

/* ── Achievement Toast ── */
.achievement-toast{position:fixed;bottom:20px;right:20px;display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 8px 32px #0008,0 0 24px var(--accent-glow);transform:translateY(120px);opacity:0;transition:all .4s cubic-bezier(.22,1,.36,1);z-index:100}
.achievement-toast.show{transform:translateY(0);opacity:1}
.toast-icon{font-size:28px}
.toast-content{display:flex;flex-direction:column;gap:2px}
.toast-title{font-size:14px;font-weight:700;color:var(--text)}
.toast-xp{font-size:13px;font-weight:600;color:var(--accent)}
.toast-close{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;margin-left:8px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
