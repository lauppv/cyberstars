services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 8080
    volumes:
      # Docker socket is required for sandboxed code execution (C, Python, Java, Linux terminal).
      # The app spawns docker run commands inside the container via this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '8080:8080'
    # Before running `docker compose up`, make sure the following images are available on the host:
    #   docker build -t cyberstars-linux-sandbox server/runtimes/linux-sandbox
    #   docker pull gcc:14
    #   docker pull python:3.10-slim
    #   docker pull eclipse-temurin:21-jdk-alpine

volumes:
  pgdata:
