services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 5

  setup:
    image: docker:cli
    entrypoint: >
      sh -c "
        docker pull gcc:latest &&
        docker pull python:3.10-slim &&
        docker pull eclipse-temurin:21-jdk-alpine &&
        docker build -t cyberstars-linux-sandbox /context
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server/runtimes/linux-sandbox:/context

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment:
      DB_USER: ${DB_USER}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 8080
      CODE_RUN_DIR: /tmp/cyberstars-runs
    volumes:
      # Docker socket is required for sandboxed code execution (C, Python, Java, Linux terminal).
      # The app spawns docker run commands inside the container via this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared directory for code execution — same path on host and in container,
      # so Docker daemon can resolve bind-mount paths correctly (DooD pattern).
      - /tmp/cyberstars-runs:/tmp/cyberstars-runs
    ports:
      - "8080:8080"

volumes:
  pgdata:
